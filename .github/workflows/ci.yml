name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    name: Check (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: minimum
            node-version: 22.19.0
            oxlint-version: 1.78.0
          - target: latest-oxlint
            node-version: 24
            oxlint-version: latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Oxlint ${{ matrix.oxlint-version }} compatibility packages
        run: npm install --no-save --package-lock=false oxlint@${{ matrix.oxlint-version }} @oxlint/plugins@${{ matrix.oxlint-version }}

      - name: Check
        run: npm run check
